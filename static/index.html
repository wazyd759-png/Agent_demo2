<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>SQL Agent 问答助手</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif;
           max-width: 820px; margin: 0 auto; padding: 40px 20px; background: #f5f6f8; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .sub { color: #8a9099; font-size: 14px; margin-bottom: 24px; }
    .input-row { display: flex; gap: 10px; }
    input[type=text] { flex: 1; padding: 14px 16px; font-size: 15px;
                       border: 1px solid #e3e6ea; border-radius: 10px; outline: none; }
    input[type=text]:focus { border-color: #2563eb; }
    button { padding: 14px 26px; font-size: 15px; border: none; border-radius: 10px;
             background: #2563eb; color: #fff; cursor: pointer; }
    button:disabled { opacity: .55; }
    .examples { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .examples button { background: #fff; color: #4b5563; border: 1px solid #e3e6ea;
                       padding: 6px 12px; font-size: 13px; border-radius: 20px; }
    .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 12px;
            padding: 20px; margin-top: 18px; }
    .card h2 { font-size: 13px; margin: 0 0 12px; color: #8a9099;
               text-transform: uppercase; letter-spacing: .06em; }
    .answer { white-space: pre-wrap; line-height: 1.75; font-size: 15px; }
    .sql { background: #fafbfc; border: 1px solid #e3e6ea; border-radius: 8px;
           padding: 12px 14px; margin-top: 10px; font-family: Menlo, monospace;
           font-size: 13px; color: #444; word-break: break-word; }
    .rejected { color: #dc2626; }
    .status { margin-top: 14px; font-size: 14px; color: #8a9099; min-height: 20px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>🗄️ SQL Agent 问答助手</h1>
  <div class="sub">用自然语言查询订单数据（只读）</div>

  <div class="input-row">
    <input id="q" type="text" placeholder="例如：销量最高的产品是哪个？" />
    <button id="send">提问</button>
  </div>

  <div class="examples">
    <button data-q="销量最高的产品是哪个">销量最高的产品是哪个</button>
    <button data-q="一共有多少个订单">一共有多少个订单</button>
    <button data-q="每个产品的总销售额是多少">每个产品的总销售额</button>
    <button data-q="平均订单金额是多少">平均订单金额</button>
  </div>

  <div id="status" class="status"></div>

  <div id="answer-card" class="card hidden">
    <h2>回答</h2>
    <div id="answer" class="answer"></div>
    <div id="sql-box" class="sql hidden"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    async function ask() {
      const question = $("q").value.trim();
      if (!question) return;

      $("send").disabled = true;
      $("status").textContent = "处理中...";
      $("answer-card").classList.add("hidden");

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `HTTP ${res.status}`);
        }
        const data = await res.json();
        $("answer").textContent = data.answer;
        $("answer").className = "answer" + (data.rejected ? " rejected" : "");
        if (data.sql) {
          $("sql-box").textContent = "生成的 SQL：" + data.sql;
          $("sql-box").classList.remove("hidden");
        } else {
          $("sql-box").classList.add("hidden");
        }
        $("answer-card").classList.remove("hidden");
        $("status").textContent = "";
      } catch (e) {
        $("status").textContent = "❌ " + e.message;
      } finally {
        $("send").disabled = false;
      }
    }

    $("send").addEventListener("click", ask);
    $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
    document.querySelectorAll(".examples button").forEach((b) => {
      b.addEventListener("click", () => { $("q").value = b.dataset.q; ask(); });
    });
  </script>
</body>
</html>
