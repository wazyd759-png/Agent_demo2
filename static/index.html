<!-- static/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>产品知识库 · RAG 问答</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --border: #e3e6ea;
      --text: #1f2329; --muted: #8a9099; --primary: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .input-row { display: flex; gap: 10px; }
    input[type="text"] {
      flex: 1; padding: 14px 16px; font-size: 15px; outline: none;
      border: 1px solid var(--border); border-radius: 10px; background: var(--card);
    }
    input[type="text"]:focus { border-color: var(--primary); }
    .btn-primary {
      padding: 14px 26px; font-size: 15px; border: none; border-radius: 10px;
      background: var(--primary); color: #fff; cursor: pointer;
    }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
    .examples { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .examples button {
      background: #fff; color: #4b5563; border: 1px solid var(--border);
      padding: 6px 12px; font-size: 13px; border-radius: 20px; cursor: pointer;
    }
    .status { margin-top: 14px; font-size: 14px; color: var(--muted); min-height: 20px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-top: 18px;
    }
    .card h2 {
      font-size: 13px; margin: 0 0 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
    }
    .answer-text { white-space: pre-wrap; line-height: 1.75; font-size: 15px; }
    .source {
      border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px;
      padding: 10px 14px; background: #fafbfc;
    }
    .source summary { cursor: pointer; font-size: 14px; font-weight: 500; }
    .source pre {
      white-space: pre-wrap; word-break: break-word; font-size: 13px;
      line-height: 1.7; color: #444; margin: 10px 0 0; font-family: inherit;
    }
    .score { color: var(--muted); font-weight: 400; margin-left: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📚 产品知识库问答</h1>
    <div class="sub">基于向量召回 + CrossEncoder 重排的 RAG 演示</div>

    <div class="input-row">
      <input id="q" type="text" placeholder="请输入你的问题，例如：GPT5.6 系列产品是如何推出的？" />
      <button id="send" class="btn-primary">提问</button>
    </div>

    <div class="examples">
      <button data-q="GPT5.6系列产品如何被推出的">GPT5.6系列产品如何被推出的</button>
    </div>

    <div id="status" class="status"></div>

    <div id="answer-card" class="card hidden">
      <h2>回答</h2>
      <div id="answer-text" class="answer-text"></div>
    </div>

    <div id="sources-card" class="card hidden">
      <h2>来源 Sources <span id="src-count"></span></h2>
      <div id="sources-list"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function render(data) {
      $("answer-text").textContent = data.answer;
      $("answer-card").classList.remove("hidden");

      const list = $("sources-list");
      list.innerHTML = "";
      $("src-count").textContent = `(${data.sources.length})`;

      data.sources.forEach((s) => {
        const el = document.createElement("details");
        el.className = "source";

        const summary = document.createElement("summary");
        summary.innerHTML =
          `来源 ${s.index} <span class="score">重排得分 ${s.score}</span>`;

        const pre = document.createElement("pre");
        pre.textContent = s.content;   // textContent 天然防 XSS

        el.appendChild(summary);
        el.appendChild(pre);
        list.appendChild(el);
      });

      $("sources-card").classList.toggle("hidden", data.sources.length === 0);
    }

    async function ask() {
      const question = $("q").value.trim();
      if (!question) return;

      $("send").disabled = true;
      $("status").textContent = "检索并生成中，请稍候…";
      $("answer-card").classList.add("hidden");
      $("sources-card").classList.add("hidden");

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `HTTP ${res.status}`);
        }

        render(await res.json());
        $("status").textContent = "";
      } catch (e) {
        $("status").textContent = "❌ 出错：" + e.message;
      } finally {
        $("send").disabled = false;
      }
    }

    $("send").addEventListener("click", ask);
    $("q").addEventListener("keydown", (e) => {
      if (e.key === "Enter") ask();
    });
    document.querySelectorAll(".examples button").forEach((btn) => {
      btn.addEventListener("click", () => {
        $("q").value = btn.dataset.q;
        ask();
      });
    });
  </script>
</body>
</html>
